spring:
  application:
    name: resqai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resqai}
    username: ${DB_USERNAME:resqai}
    password: ${DB_PASSWORD:resqai}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.resqai.backend: INFO
    org.springframework.security: WARN

# ---------------------------------------------------------------------------
# ResQ AI application configuration
# ---------------------------------------------------------------------------
resqai:
  cors:
    # Vercel deployment + local dev. Comma separated.
    allowed-origins: ${CORS_ORIGINS:https://res-q-ai-nine.vercel.app,http://localhost:5173,http://localhost:3000}

  jwt:
    # MUST be overridden in production. Minimum 32 bytes for HS256.
    secret: ${JWT_SECRET:change-me-to-a-long-random-value-at-least-32-bytes-long!!}
    issuer: resqai
    access-token-ttl: PT15M
    refresh-token-ttl: P7D

  rate-limit:
    enabled: true
    auth-requests-per-minute: 20
    news-requests-per-minute: 60

  geocoding:
    # OpenStreetMap Nominatim. Free, no key. Usage policy requires a real
    # contact in the User-Agent and max ~1 request/second.
    base-url: https://nominatim.openstreetmap.org
    user-agent: ${GEOCODER_USER_AGENT:ResQ-AI/0.1 (contact@resqai.example)}
    enabled: true

  news:
    default-radius-km: 300
    max-radius-km: 2000
    default-history-days: 90
    max-history-days: 365
    live-cache-minutes: 5
    history-cache-minutes: 30
    articles-cache-minutes: 15
    per-provider-timeout-ms: 6000
  weather:
    enabled: true
    base-url: https://api.open-meteo.com/v1/forecast
    cache-minutes: 10
    usgs:
      enabled: true
      base-url: https://earthquake.usgs.gov/fdsnws/event/1/query
      min-magnitude: 2.5

    gdacs:
      enabled: true
      base-url: https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH
      event-types: EQ;TC;FL;VO;DR;WF
      alert-levels: Green;Orange;Red

    eonet:
      enabled: true
      base-url: https://eonet.gsfc.nasa.gov/api/v3/events

    reliefweb:
      # v2 requires a pre-approved appname since Nov 2025. Request one at
      # https://apidoc.reliefweb.int/ then set RELIEFWEB_APPNAME.
      enabled: ${RELIEFWEB_ENABLED:true}
      base-url: https://api.reliefweb.int/v2/reports
      appname: ${RELIEFWEB_APPNAME:resqai}

    gnews:
      # https://gnews.io - free tier. Leave key blank to disable.
      enabled: true
      base-url: https://gnews.io/api/v4/search
      api-key: ${GNEWS_API_KEY:}
      language: en
      max-articles: 10
