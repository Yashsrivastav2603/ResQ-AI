# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# In-memory H2 so you can boot without PostgreSQL while wiring the frontend.
spring:
  datasource:
    url: jdbc:h2:mem:resqai;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
logging:
  level:
    com.resqai.backend: DEBUG
