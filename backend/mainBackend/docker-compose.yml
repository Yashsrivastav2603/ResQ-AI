services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resqai
      POSTGRES_USER: resqai
      POSTGRES_PASSWORD: resqai
    ports:
      - "5432:5432"
    volumes:
      - resqai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/resqai
      DB_USERNAME: resqai
      DB_PASSWORD: resqai
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-at-least-32-bytes-long}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://res-q-ai-nine.vercel.app,http://localhost:5173}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      RELIEFWEB_APPNAME: ${RELIEFWEB_APPNAME:-resqai}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-ResQ-AI/0.1 (you@example.com)}
    ports:
      - "8080:8080"

volumes:
  resqai_pgdata:
